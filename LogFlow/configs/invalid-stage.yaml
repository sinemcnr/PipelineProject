pipeline:
  name: error-report

  source:
    type: file
    params:
      path: data/access-small.log

  stages:
    - type: parse
      params:
        format: clf

    - type: unknown
      params:
        field: status
        op: ">="
        value: 400

    - type: project
      params:
        fields:
          - timestamp
          - clientIp
          - status
          - path

  sink:
    type: file
    params:
      path: output/errors.txt
